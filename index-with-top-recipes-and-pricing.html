    * {

      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background-color: #e8e8e8;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 20px;
    }

    .phone-frame {
      width: 375px;
      height: 812px;
      background: var(--color-page-bg);
      border-radius: 40px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }

    /* Zest Design System Tokens */
    :root {
      /* Page / Elevation */
      --color-page-bg: #f5f5f0;
      --color-elevation-bg: #faf8f3;
      --color-elevation-level-1: #efe9de;
      --color-elevation-level-2: #e0d9cb;
      --color-factor-carbon-100: #f9f9f3;

      /* Neutral foreground */
      --color-neutral-fg-darkest: #024426;
      --color-neutral-fg-default: #242424;
      --color-neutral-fg-darker: #454545;
      --color-neutral-fg-base-alt: #4b4b4b;
      --color-neutral-fg-inverse: #ffffff;
      --color-neutral-fg-unselected: #656565;

      /* Brand */
      --color-brand-primary: #bbf06a;
      --color-brand-green-500: #067a46;
      --color-brand-bg: #067a46; /* Zest: alias.color.brand.background.default */
      --color-brand-border-subtle: #8ccf9a;
      --color-selected-bg-primary: #bbf06a;

      /* Tags */
      --color-tag-interactive-bg: #efe9de;
      --color-tag-interactive-fg: #242424;
      --color-tag-static-bg-v0: #e0d9cb;
      --color-tag-static-fg-v0: #024426;
      --color-tag-static-bg-v1: #db1d1d;
      --color-tag-static-fg-v1: #ffffff;
      --color-tag-static-bg-v2: #067a46;
      --color-tag-static-fg-v2: #ffffff;

      /* Divider */
      --color-divider: #c1c1c1;

      /* Bottom nav */
      --color-bottom-nav-bg: #e0d9cb;
      --color-bottom-nav-fg-selected: #024426;
      --color-bottom-nav-fg-unselected: #656565;

      /* Button */
      --color-button-brand-bg-disabled: #adadad;
      --color-button-brand-fg: #ffffff;
      --color-button-border: #024426;

      /* Badge */
      --color-badge-positive-bg: #007838;
      --color-badge-border: #faf8f3;
      --color-badge-fg: #ffffff;

      /* Number stepper */
      --color-stepper-bg: #efe9de;
      --color-stepper-border: #024426;
      --color-stepper-selected-bg: #efe9de;

      /* Icon button toggle */
      --color-icon-btn-toggle-bg: #024426;
      --color-icon-btn-toggle-fg: #ffffff;

      /* Benefits */
      --color-benefits: #b5e7ba;
      --color-purple-100: #f7e9ff;

      /* Tab group */
      --color-tab-fg-selected: #024426;
      --color-tab-fg-unselected: #242424;
      --color-tab-border-selected: #024426;
      --color-tab-border-unselected: #e0e0e0;

      /* Dialog */
      --dialog-overlay: rgba(0, 0, 0, 0.5);

      /* Spacing */
      --spacing-none: 0px;
      --spacing-xxs: 4px;
      --spacing-xs: 8px;
      --spacing-sm-1: 12px;
      --spacing-sm-2: 16px;
      --spacing-md-1: 24px;

      /* Corner radius */
      --radius-card: 12px;
      --radius-button: 8px;
      --radius-tag-rect: 4px;
      --radius-tag-pill: 999px;
      --radius-stepper: 8px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-dialog: 16px;

      /* Typography */
      --font-body: 'Roboto', sans-serif;
      --font-headline: 'Roboto', sans-serif; /* Agrandir substitute */

      --lh-xs: 16px;
      --lh-sm: 20px;
      --lh-md: 24px;
      --lh-lg: 32px;

      --fs-xs: 12px;
      --fs-sm: 14px;
      --fs-md: 16px;
      --fs-lg: 20px;
      --fs-xl: 24px;
    }

    /* Scrollbar styling */
    .scroll-area::-webkit-scrollbar { display: none; }
    .scroll-area { -ms-overflow-style: none; scrollbar-width: none; }
    .h-scroll::-webkit-scrollbar { display: none; }
    .h-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    .recipe-scroll::-webkit-scrollbar { display: none; }
    .recipe-scroll { -ms-overflow-style: none; scrollbar-width: none; }

    /* Recipe scroll snap */
    .recipe-scroll {
      scroll-snap-type: x proximity;
      overflow-anchor: none;
    }
    .recipe-scroll > div > div {
      scroll-snap-align: start;
    }

    /* Ensure left nav is hidden by default */
    [class*="recipe-nav-left"] {
      display: none !important;
    }
    [class*="recipe-nav-left"].show {
      display: flex !important;
    }

    /* Recipe nav button animations */
    .recipe-nav-btn {
      transition: transform 0.15s ease, opacity 0.2s ease;
    }
    .recipe-nav-btn:active {
      transform: scale(0.92);
    }
    .recipe-nav-btn svg {
      transition: transform 0.15s ease;
    }
    .recipe-nav-btn:active svg {
      transform: scale(0.9);
    }

    /* Quality tag animation */
    @keyframes qualityFadeSlideIn {
      0% {
        opacity: 0;
        transform: translateX(-50%) translateY(-10px) scale(0.8);
      }
      60% {
        opacity: 1;
        transform: translateX(-50%) translateY(0) scale(1.1);
      }
      100% {
        opacity: 1;
        transform: translateX(-50%) translateY(0) scale(1);
      }
    }
    @keyframes qualityWiggle {
      0%, 100% {
        transform: translateX(-50%) translateY(0) rotate(0deg);
      }
      20% {
        transform: translateX(calc(-50% + 3px)) translateY(0) rotate(2deg);
      }
      40% {
        transform: translateX(calc(-50% - 3px)) translateY(0) rotate(-2deg);
      }
      60% {
        transform: translateX(calc(-50% + 2px)) translateY(0) rotate(1deg);
      }
      80% {
        transform: translateX(calc(-50% - 2px)) translateY(0) rotate(-1deg);
      }
    }
    @keyframes qualityGlow {
      0%, 100% {
        box-shadow: 0 2px 8px rgba(6, 122, 70, 0.3);
      }
      50% {
        box-shadow: 0 4px 16px rgba(6, 122, 70, 0.6), 0 0 24px rgba(6, 122, 70, 0.3);
      }
    }
    @keyframes diamondSparkle {
      0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
      25% { transform: scale(1.2) rotate(10deg); opacity: 1; }
      50% { transform: scale(1) rotate(0deg); opacity: 0.8; }
      75% { transform: scale(1.2) rotate(-10deg); opacity: 1; }
    }
    @keyframes sparkleFloat {
      0% { opacity: 0; transform: scale(0) translateY(0); }
      50% { opacity: 1; transform: scale(1) translateY(-5px); }
      100% { opacity: 0; transform: scale(0) translateY(-10px); }
    }
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    @keyframes slideUpDrawer {
      from {
        transform: translateY(100%);
      }
      to {
        transform: translateY(0);
      }
    }
    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
    @keyframes particleBurst {
      0% {
        transform: translate(0, 0) scale(1);
        opacity: 1;
      }
      70% {
        opacity: 0.8;
      }
      100% {
        transform: translate(var(--tx), var(--ty)) scale(0);
        opacity: 0;
      }
    }
    @keyframes fadeOut {
      from {
        opacity: 1;
        transform: scale(1);
      }
      to {
        opacity: 0;
        transform: scale(0.9);
      }
    }
    @keyframes magicReveal {
      0% {
        opacity: 0;
        transform: scale(0.8) translateY(20px);
      }
      60% {
        transform: scale(1.05) translateY(-5px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }
    .quality-tag {
      opacity: 1;
    }
    .quality-icon {
      /* animation removed */
    }
    .sparkle-left, .sparkle-right {
      /* animation removed */
    }

    /* Organic info drawer slide animation */
    @keyframes slideInFromRight {
      0% {
        transform: translateX(100%);
      }
      100% {
        transform: translateX(0);
      }
    }
    .organic-drawer-enter {
      animation: slideInFromRight 0.3s ease-out forwards;
    }
    @keyframes confetti-fall {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(600px) rotate(720deg);
        opacity: 0;
      }
    }
    @keyframes badgePulse {
      0% { transform: scale(1); }
      40% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
    .badge-pulse {
      animation: badgePulse 0.3s ease-out;
    }
    @keyframes featureTagGlow {
      0%, 100% { box-shadow: 0 0 4px rgba(255, 213, 79, 0.4); }
      50% { box-shadow: 0 0 12px rgba(255, 213, 79, 0.8); }
    }
    .feature-tag-pulse {
      animation: featureTagGlow 2s ease-in-out infinite;
    }

    /* Laurel wreath animation for premium ingredients */
    @keyframes laurelSeparateLeft {
      0% { transform: translateX(8px); }
      100% { transform: translateX(0); }
    }
    @keyframes laurelSeparateRight {
      0% { transform: translateX(-8px); }
      100% { transform: translateX(0); }
    }
    @keyframes laurelTextFadeIn {
      0% { opacity: 0; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1); }
    }
    .laurel-left {
      animation: laurelSeparateLeft 0.5s ease-out 0.3s forwards;
      transform: translateX(8px);
    }
    @keyframes laurelSeparateRightMirrored {
      0% { transform: scaleX(-1) translateX(8px); }
      100% { transform: scaleX(-1) translateX(0); }
    }
    .laurel-right {
      animation: laurelSeparateRightMirrored 0.5s ease-out 0.3s forwards;
      transform: scaleX(-1) translateX(8px);
    }
    .laurel-text {
      opacity: 0;
      animation: laurelTextFadeIn 0.4s ease-out 0.7s forwards;
    }
    @keyframes slideUpFromBottom {
      0% {
        opacity: 0;
        transform: translateY(30px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .promo-banner-animate {
      animation: slideUpFromBottom 0.4s ease-out forwards;
    }
    @keyframes foodImagePop {
      0% {
        transform: translateY(-50%) scale(0.6);
      }
      60% {
        transform: translateY(-50%) scale(1.25);
      }
      100% {
        transform: translateY(-50%) scale(1.2);
      }
    }
    .food-image-pop {
      animation: foodImagePop 0.5s ease-out forwards;
    }
  </style>
</head>

    // ========== WEEK NAVIGATION ==========
    function WeekNavigation() {
      const weeks = [
        { dayLabel: 'Past\nDeliveries', isPast: true },
        { dayLabel: 'Wed', title: 'March 1st', selected: true },
        { dayLabel: 'Wed', title: 'March 8th' },
        { dayLabel: 'Wed', title: 'March 15th' },
        { dayLabel: 'Wed', title: 'March 22nd' },
        { dayLabel: 'Wed', title: 'March 29th' },
        { dayLabel: 'Wed', title: 'April 5th' },
      ];

      return (
        <div style={{
          background: 'var(--color-brand-green-500)',
          padding: '0 16px 8px',
          display: 'flex',
          gap: 8,
          overflowX: 'auto',
          alignItems: 'center',
        }} className="h-scroll">
          {weeks.map((w, i) => {
            if (w.isPast) {
              return (
                <div key={i} style={{
                  flexShrink: 0,
                  display: 'flex',
                  flexDirection: 'column',
                  alignItems: 'center',
                  justifyContent: 'center',
                  padding: '4px 16px',
                  height: 44,
                  cursor: 'pointer',
                }}>
                  <span style={{
                    fontFamily: 'var(--font-body)',
                    fontSize: 'var(--fs-xs)',
                    lineHeight: 'var(--lh-xs)',
                    color: 'var(--color-neutral-fg-inverse)',
                    textDecoration: 'underline',
                    textAlign: 'center',
                    whiteSpace: 'pre-line',
                  }}>Past{'\n'}Deliveries</span>
                </div>
              );
            }

            const isSelected = w.selected;

            return (
              <div key={i} style={{
                flexShrink: 0,
                display: 'flex',
                flexDirection: 'column',
                alignItems: 'center',
                justifyContent: 'center',
                padding: '4px 16px',
                borderRadius: 'var(--radius-md)',
                background: isSelected ? 'var(--color-selected-bg-primary)' : 'transparent',
                border: !isSelected ? '1px solid var(--color-brand-border-subtle)' : 'none',
                cursor: 'pointer',
              }}>
                <span style={{
                  fontFamily: 'var(--font-body)',
                  fontSize: 10,
                  lineHeight: 'var(--lh-xs)',
                  color: isSelected ? 'var(--color-neutral-fg-darkest)' : 'var(--color-neutral-fg-inverse)',
                  textAlign: 'center',
                }}>{w.dayLabel}</span>
                <span style={{
                  fontFamily: 'var(--font-headline)',
                  fontSize: 'var(--fs-sm)',
                  fontWeight: 700,
                  lineHeight: 'var(--lh-xs)',
                  color: isSelected ? 'var(--color-neutral-fg-darkest)' : 'var(--color-neutral-fg-inverse)',
                  textAlign: 'center',
                  whiteSpace: 'nowrap',
                }}>{w.title}</span>
              </div>
            );
          })}
        </div>
      );
    }

    // ========== MEAL SELECTION GUIDANCE ==========
    function MealSelectionGuidance({ totalItems, mealsNeeded, onCartClick, isHidden, onContinue }) {
      const remaining = Math.max(0, mealsNeeded - totalItems);
      const isComplete = remaining === 0;
      const [isAnimating, setIsAnimating] = useState(false);
      const prevTotalRef = useRef(totalItems);

      useEffect(() => {
        if (prevTotalRef.current !== totalItems) {
          setIsAnimating(true);
          const timer = setTimeout(() => setIsAnimating(false), 400);
          prevTotalRef.current = totalItems;
          return () => clearTimeout(timer);
        }
      }, [totalItems]);

      return (
        <div style={{
          position: 'absolute',
          bottom: 83,
          left: 8,
          right: 8,
          background: 'var(--color-elevation-level-1)',
          borderRadius: 'var(--radius-md)',
          padding: 16,
          display: 'flex',
          flexDirection: 'column',
          gap: 16,
          zIndex: 10,
          opacity: isHidden ? 0 : 1,
          transform: isHidden ? 'translateY(20px)' : 'translateY(0)',
          transition: 'opacity 0.2s ease, transform 0.2s ease',
          pointerEvents: isHidden ? 'none' : 'auto',
        }}>
          {/* Action row */}
          <div style={{ display: 'flex', gap: 8, alignItems: 'stretch' }}>
            {/* Cart CTA */}
            <button
              onClick={onCartClick}
              style={{

              alignItems: 'center',
              gap: 8,
              padding: '8px 24px',
              border: '1px solid black',
              borderRadius: 'var(--radius-button)',
              background: 'var(--color-elevation-level-1)',
              cursor: 'pointer',
              position: 'relative',
              flexShrink: 0,
            }}>
              {Icons.cart(24, 'black')}

              {/* Badge */}

                <span
                  className={isAnimating ? 'badge-pulse' : ''}

    // ========== CART DRAWER ==========
    function CartDrawer({ isOpen, onClose, cart, mealsData, onRemove, onAdd, bookmarkedRecipes, toggleBookmark, openToSavedRecipes }) {
      const [addonQuantities, setAddonQuantities] = useState({ addon1: 1, addon2: 1 });
      const [upsellQuantities, setUpsellQuantities] = useState({ upsell1: 0, upsell2: 0 });
      const [upsellEditing, setUpsellEditing] = useState({ upsell1: false, upsell2: false });
      const upsellTimeoutRef = useRef({});
      const [savedRecipesEditing, setSavedRecipesEditing] = useState({});
      const savedRecipesTimeoutRef = useRef({});
      const [isCartScrolling, setIsCartScrolling] = useState(false);
      const cartScrollTimeoutRef = useRef(null);
      const [flyingRecipe, setFlyingRecipe] = useState(null);
      const [animateFlying, setAnimateFlying] = useState(false);
      const [flyingRecipeId, setFlyingRecipeId] = useState(null);
      const savedRecipesRefs = useRef({});
      const [displayedSavedRecipes, setDisplayedSavedRecipes] = useState([]);
      const [activeTab, setActiveTab] = useState('cart'); // 'cart' or 'saved'
      const [showUnsaveToast, setShowUnsaveToast] = useState(false);
      const [lastUnsavedRecipe, setLastUnsavedRecipe] = useState(null);
      const [removedRecipeData, setRemovedRecipeData] = useState(null); // Track removed recipe with position: { id, position, section }
      const unsaveToastTimeoutRef = useRef(null);
      const [savedTabEditing, setSavedTabEditing] = useState({}); // Track which recipes in Saved tab show stepper
      const savedTabTimeoutRef = useRef({});

      // Reset state when drawer closes, or open to saved tab if requested
      useEffect(() => {
        if (!isOpen) {
          // Reset all state when drawer closes
          setActiveTab('cart');
          setFlyingRecipe(null);
          setAnimateFlying(false);
          setFlyingRecipeId(null);
          setSavedRecipesEditing({});
          setUpsellEditing({ upsell1: false, upsell2: false });
          setShowUnsaveToast(false);
          setLastUnsavedRecipe(null);
          setRemovedRecipeData(null);
          setSavedTabEditing({});
          // Clear all timeouts
          if (unsaveToastTimeoutRef.current) {
            clearTimeout(unsaveToastTimeoutRef.current);
          }
          Object.values(savedTabTimeoutRef.current).forEach(timeout => clearTimeout(timeout));
          savedTabTimeoutRef.current = {};
        } else if (openToSavedRecipes) {
          // Open to saved tab if requested
          setActiveTab('saved');
        }
      }, [isOpen, openToSavedRecipes]);

      // Update displayed saved recipes only when not animating
      useEffect(() => {
        if (!flyingRecipeId) {
          const filtered = mealsData.filter(meal => !cart[meal.id] || cart[meal.id] === 0).slice(0, 5);
          setDisplayedSavedRecipes(filtered);
        }
      }, [cart, mealsData, flyingRecipeId]);

      const handleCartScroll = () => {
        setIsCartScrolling(true);
        if (cartScrollTimeoutRef.current) {
          clearTimeout(cartScrollTimeoutRef.current);
        }
        cartScrollTimeoutRef.current = setTimeout(() => {
          setIsCartScrolling(false);
        }, 150);
      };

      const handleSavedRecipeAdd = (meal, event) => {
        const cardElement = savedRecipesRefs.current[meal.id];
        if (!cardElement) {
          onAdd(meal.id);
          return;
        }

        // Mark this recipe as animating to prevent it from disappearing
        setFlyingRecipeId(meal.id);

        // Get card position
        const cardRect = cardElement.getBoundingClientRect();

        // Get target position (meals section at top of cart)
        const targetElement = document.querySelector('.cart-meals-section');
        const targetRect = targetElement ? targetElement.getBoundingClientRect() : { top: 100, left: cardRect.left, width: 343 };

        // Calculate center position for smooth landing
        const endX = targetRect.left + 16; // Account for padding
        const endY = targetRect.top + targetRect.height - 80; // Place near bottom of meals section

        // Set flying recipe with animation data
        setFlyingRecipe({
          meal,
          startX: cardRect.left,
          startY: cardRect.top,
          endX: endX,
          endY: endY,
          width: cardRect.width,
          height: cardRect.height,
        });

        // Start animation on next frame
        setAnimateFlying(false);
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            setAnimateFlying(true);
          });
        });

        // After animation completes, add to cart and clear flying recipe
        setTimeout(() => {
          onAdd(meal.id);
          setFlyingRecipe(null);
          setAnimateFlying(false);
          setFlyingRecipeId(null); // Clear the animating recipe ID
        }, 700);
      };

      const handleBookmarkToggleInSaved = (recipeId, currentPosition, section) => {
        const wasBookmarked = bookmarkedRecipes.has(recipeId);

        if (wasBookmarked) {
          // Unsaving - show toast with undo but keep recipe visible at position
          setLastUnsavedRecipe(recipeId);
          toggleBookmark(recipeId);

          // Store removed recipe with its original position and section
          setRemovedRecipeData({ id: recipeId, position: currentPosition, section: section });

          setShowUnsaveToast(true);

          // Auto-hide toast and remove from visible list after 3 seconds
          if (unsaveToastTimeoutRef.current) {
            clearTimeout(unsaveToastTimeoutRef.current);
          }
          unsaveToastTimeoutRef.current = setTimeout(() => {
            setShowUnsaveToast(false);
            setLastUnsavedRecipe(null);
            setRemovedRecipeData(null);
          }, 3000);
        } else {
          // Saving - just toggle without toast
          toggleBookmark(recipeId);
        }
      };

      const handleUndoUnsave = () => {
        if (lastUnsavedRecipe) {
          toggleBookmark(lastUnsavedRecipe);
          setShowUnsaveToast(false);
          setRemovedRecipeData(null);
          setLastUnsavedRecipe(null);
          if (unsaveToastTimeoutRef.current) {
            clearTimeout(unsaveToastTimeoutRef.current);
          }
        }
      };

      const handleSavedTabAdd = (mealId) => {
        onAdd(mealId);
        setSavedTabEditing(prev => ({ ...prev, [mealId]: true }));
        if (savedTabTimeoutRef.current[mealId]) {
          clearTimeout(savedTabTimeoutRef.current[mealId]);
        }
        savedTabTimeoutRef.current[mealId] = setTimeout(() => {
          setSavedTabEditing(prev => ({ ...prev, [mealId]: false }));
        }, 1500);
      };

      const handleSavedTabRemove = (mealId) => {
        onRemove(mealId);
        if (savedTabTimeoutRef.current[mealId]) {
          clearTimeout(savedTabTimeoutRef.current[mealId]);
        }
        savedTabTimeoutRef.current[mealId] = setTimeout(() => {
          setSavedTabEditing(prev => ({ ...prev, [mealId]: false }));
        }, 1500);
      };

      if (!isOpen) return null;

      // Ensure activeTab is always valid
      const currentTab = activeTab === 'saved' ? 'saved' : 'cart';

      const cartItems = Object.entries(cart).map(([id, qty]) => ({
        ...mealsData.find(m => m.id === parseInt(id)),
        quantity: qty
      })).filter(item => item.id);

      const addOns = [
        { id: 'addon2', name: 'Everything bagels 6 pack', price: 'FREE', originalPrice: '$9.99', badge: null, img: 'https://images.unsplash.com/photo-1608198093002-ad4e005484ec?w=200&h=200&fit=crop' },
      ];

      const totalMeals = Object.values(cart).reduce((sum, q) => sum + q, 0);
      const totalItems = totalMeals; // Total items in cart for tab badge
      const mealsPrice = totalMeals * 9.99;
      const addonsPrice = 131.95;
      const shipping = 0;

      return (

              </button>
              <div style={{ textAlign: 'center' }}>
                <h2 style={{
                  fontFamily: 'var(--font-headline)',
                  fontSize: 'var(--fs-lg)',
                  fontWeight: 700,
                  margin: '0 0 4px 0',
                  color: 'var(--color-neutral-fg-default)',

                <div style={{
                  fontFamily: 'var(--font-body)',
                  fontSize: 'var(--fs-sm)',
                  color: 'var(--color-neutral-fg-default)',
                  textDecoration: 'underline',
                }}>Edit delivery by Wed, May 5</div>
              </div>
            </div>

            {/* Tabs */}
            <div style={{ display: 'flex', borderBottom: '4px solid var(--color-divider)' }}>
              <button onClick={() => setActiveTab('cart')} style={{
                flex: 1,
                padding: '16px',
                background: 'none',
                border: 'none',
                borderBottom: currentTab === 'cart' ? '4px solid black' : '4px solid transparent',
                fontFamily: 'var(--font-body)',
                fontSize: 'var(--fs-md)',
                fontWeight: currentTab === 'cart' ? 700 : 400,
                lineHeight: 'var(--lh-md)',
                color: 'black',
                cursor: 'pointer',
                marginBottom: -4,
              }}>Cart ({totalItems})</button>
              <button onClick={() => setActiveTab('saved')} style={{
                flex: 1,

                border: 'none',
                borderBottom: currentTab === 'saved' ? '4px solid black' : '4px solid transparent',
                fontFamily: 'var(--font-body)',

            {currentTab === 'cart' ? (

                {/* Scrollable content */}

                  {/* Meals section */}
              <div className="cart-meals-section" style={{ padding: '16px 16px 16px' }}>

    // ========== RATING DRAWER ==========
    function RatingDrawer({ show, onClose, recipes, ratings, onRate, onShowMoreRecipes, showMoreRecipes, onNavigateToPastOrders, hideRemindLater }) {
      const scrollContainerRef = useRef(null);
      const [particles, setParticles] = useState([]);
      const [isFadingOut, setIsFadingOut] = useState(false);

      // Reset fade state when drawer closes
      React.useEffect(() => {
        if (!show) {
          setIsFadingOut(false);
        }
      }, [show]);

      // Auto-scroll to thank you tile when all recipes are rated
      React.useEffect(() => {
        const allRated = recipes.every((_, index) => ratings[index] > 0);
        if (allRated && scrollContainerRef.current) {
          setTimeout(() => {
            scrollContainerRef.current.scrollTo({
              left: scrollContainerRef.current.scrollWidth,
              behavior: 'smooth'
            });
          }, 800);
        }
      }, [ratings, recipes]);

      if (!show) return null;

      const handleShowMore = () => {
        setIsFadingOut(true);
        setTimeout(() => {
          onShowMoreRecipes();
          setIsFadingOut(false);

          // Scroll to show the first new recipe
          setTimeout(() => {
            if (scrollContainerRef.current) {
              const cardWidth = 260 + 16; // card width + gap
              scrollContainerRef.current.scrollTo({
                left: 4 * cardWidth, // Scroll to 5th card (index 4)
                behavior: 'smooth'
              });
            }
          }, 100);
        }, 500);
      };

      const handleStarClick = (recipeIndex, rating, event) => {
        const currentRating = ratings[recipeIndex] || 0;
        const newRating = rating + 1;

        // If clicking on the exact same filled star, remove the rating
        if (currentRating === newRating) {
          onRate(recipeIndex, 0);
          return; // Don't scroll or trigger effects when removing rating
        }

        // Otherwise set the new rating
        onRate(recipeIndex, newRating);

        // Trigger particle effect for 4 and 5 stars
        if (newRating === 4 || newRating === 5) {
          // Calculate position within the star rating container
          // Each star is 40px wide + 2px gap, so star N is at position N * 42
          const starX = rating * 42 + 20; // center of star button
          const starY = 20; // center of 40px height button

          triggerParticleEffect(recipeIndex, newRating, starX, starY, rating);
        }

        // Auto-scroll to next recipe after a short delay
        setTimeout(() => {
          if (scrollContainerRef.current && recipeIndex < recipes.length - 1) {
            const cardWidth = 260 + 16; // card width + gap
            scrollContainerRef.current.scrollTo({
              left: (recipeIndex + 1) * cardWidth,
              behavior: 'smooth'
            });
          }
        }, 600);
      };

      const triggerParticleEffect = (recipeIndex, rating, centerX, centerY, starIndex) => {
        const particleCount = rating === 5 ? 8 : 6;
        const newParticles = [];

        for (let i = 0; i < particleCount; i++) {
          const angle = (Math.PI * 2 * i) / particleCount;
          const velocity = 2 + Math.random() * 2;
          newParticles.push({
            id: `${Date.now()}-${i}-${starIndex}`,
            x: centerX,
            y: centerY,
            angle,
            velocity,
            type: rating === 5 ? 'heart' : 'sparkle',
            recipeIndex
          });
        }

        setParticles(prev => [...prev, ...newParticles]);

        // Remove particles after animation
        setTimeout(() => {
          setParticles(prev => prev.filter(p => !newParticles.some(np => np.id === p.id)));
        }, 1500);
      };

      const allRated = recipes.every((_, index) => ratings[index] > 0);

      return (
        <>
          {/* Backdrop */}
          <div
            onClick={onClose}
            style={{
              position: 'absolute',
              inset: 0,
              background: 'rgba(0, 0, 0, 0.4)',
              zIndex: 999,
              animation: 'fadeIn 0.3s ease-out',
            }}
          />

          {/* Drawer */}
          <div style={{
            position: 'absolute',
            bottom: 0,
            left: 0,
            right: 0,
            background: 'var(--color-elevation-bg)',
            borderRadius: '16px 16px 0 0',
            boxShadow: '0 -4px 20px rgba(0,0,0,0.2)',
            zIndex: 1000,
            animation: 'slideUpDrawer 0.3s ease-out',
            maxHeight: '85%',
            overflowY: 'auto',
          }}>
            {/* Drag handle */}
            <div style={{
              width: 40,
              height: 6,
              background: '#e0e0e0',
              borderRadius: 4,
              margin: '16px auto 24px',
            }} />

            {/* Content */}
            <div style={{ padding: '0 16px 24px' }}>
              {/* Title */}
              <h2 style={{
                fontFamily: 'var(--font-headline)',
                fontSize: 20,
                fontWeight: 700,
                color: '#232323',
                margin: '0 0 8px',
                textAlign: 'center',
                lineHeight: '24px',
              }}>Help us personalize your menu</h2>

              {/* Subtitle */}
              <p style={{
                fontFamily: 'var(--font-body)',
                fontSize: 16,
                fontWeight: 400,
                lineHeight: '22px',
                color: '#232323',
                margin: '0 0 24px',
                textAlign: 'center',
              }}>Rate your past meals and we'll recommend recipes you'll love.</p>

              {/* Recipe cards - scrollable */}
              <div
                ref={scrollContainerRef}
                style={{
                  margin: '0 -16px',
                  padding: '0 16px 16px',
                  overflowX: 'auto',
                  WebkitOverflowScrolling: 'touch',
                  scrollSnapType: 'x mandatory',
                  scrollPaddingLeft: '16px',
                }}
                className="h-scroll"
              >
                <div style={{
                  display: 'flex',
                  gap: 16,
                }}>
                  {recipes.map((recipe, recipeIndex) => {
                    // Determine if this is a newly revealed recipe (index 4, 5, 6)
                    const isNewRecipe = showMoreRecipes && recipeIndex >= 4;
                    const animationDelay = isNewRecipe ? `${(recipeIndex - 4) * 0.15}s` : '0s';

                    // Determine order date text
                    let orderDateText = 'order this week';
                    if (recipeIndex >= 4 && recipeIndex <= 5) {
                      orderDateText = 'order last week';
                    } else if (recipeIndex >= 6) {
                      orderDateText = 'order 2 weeks ago';
                    }

                    return (
                    <div
                      key={recipeIndex}
                      data-recipe-index={recipeIndex}
                      style={{
                        flexShrink: 0,
                        width: 260,
                        scrollSnapAlign: 'start',
                        position: 'relative',
                        animation: isNewRecipe ? `magicReveal 0.6s ease-out ${animationDelay} both` : 'none',
                      }}
                    >
                      {/* Recipe image */}
                      <div style={{
                        width: 260,
                        height: 260,
                        borderRadius: 12,
                        overflow: 'hidden',
                        marginBottom: 16,
                      }}>
                        <img
                          src={recipe.img}

                            objectFit: 'cover',

                      {/* Recipe name */}
                      <h3 style={{

                      {/* Order date */}
                      <p style={{

                      }}>{orderDateText}</p>

                      {/* Star rating with particles */}
                      <div style={{
                        display: 'flex',
                        gap: 2,
                        alignItems: 'center',
                        position: 'relative',
                      }}>
                        {[0, 1, 2, 3, 4].map((starIndex) => (
                          <button
                            key={starIndex}
                            onClick={(e) => handleStarClick(recipeIndex, starIndex, e)}
                            style={{
                              width: 40,
                              height: 40,
                              background: 'transparent',

                        {/* Particles */}
                        {particles
                          .filter(p => p.recipeIndex === recipeIndex)
                          .map((particle) => {
                            const distance = particle.velocity * 40;
                            const tx = Math.cos(particle.angle) * distance;
                            const ty = Math.sin(particle.angle) * distance;

                            return (
                              <div
                                key={particle.id}
                                style={{
                                  position: 'absolute',
                                  left: `${particle.x}px`,
                                  top: `${particle.y}px`,
                                  pointerEvents: 'none',
                                  animation: 'particleBurst 1.5s ease-out forwards',
                                  '--tx': `${tx}px`,
                                  '--ty': `${ty}px`,
                                  transform: 'translate(-50%, -50%)',
                                  zIndex: 10,
                                }}
                              >
                                {particle.type === 'heart' ? (
                                  <svg width="16" height="16" viewBox="0 0 24 24" fill="#ff6b6b">
                                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                                  </svg>
                                ) : (
                                  <svg width="12" height="12" viewBox="0 0 24 24" fill="#ffd700">
                                    <path d="M12 .587l3.668 7.568 8.332 1.151-6.064 5.828 1.48 8.279-7.416-3.967-7.417 3.967 1.481-8.279-6.064-5.828 8.332-1.151z"/>
                                  </svg>
                                )}
                              </div>
                            );
                          })}
                      </div>
                    </div>
                    );
                  })}

                  {/* First thank you tile - shown after rating initial recipes */}
                  {allRated && !showMoreRecipes && (
                    <div
                      style={{
                        flexShrink: 0,
                        width: 260,
                        scrollSnapAlign: 'start',
                        display: 'flex',
                        flexDirection: 'column',
                        alignItems: 'center',
                        justifyContent: 'center',
                        padding: '40px 20px',
                        background: '#f0f0f0',
                        borderRadius: 12,
                        minHeight: 380,
                        animation: isFadingOut ? 'fadeOut 0.5s ease-out forwards' : 'none',
                      }}
                    >
                      {/* Heart icon */}
                      <svg width="64" height="64" viewBox="0 0 24 24" fill="#ff6b6b" style={{ marginBottom: 24 }}>
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                      </svg>

                      {/* Thank you text */}

            const currentRating = recipeRatings[recipe.id] || recipe.rating;

            if (selectedFilter === 'Top Rated') return currentRating >= 4;
            if (selectedFilter === 'Saved') return bookmarkedRecipes.has(recipe.id);
            if (selectedFilter === 'Unrated') return currentRating === 0;

            return true;
          })
        })).filter(order => order.recipes.length > 0);

      const filteredOrders = getFilteredOrders();

      const triggerParticleEffect = (recipeId, rating, centerX, centerY) => {
        const particleCount = rating === 5 ? 8 : 6;
        const newParticles = [];

        for (let i = 0; i < particleCount; i++) {
          const angle = (Math.PI * 2 * i) / particleCount;
          const velocity = 2 + Math.random() * 2;
          newParticles.push({
            id: `${Date.now()}-${i}-${recipeId}`,
            x: centerX,
            y: centerY,
            angle,
            velocity,
            type: rating === 5 ? 'heart' : 'sparkle',
            recipeId
          });
        }

        setParticles(prev => [...prev, ...newParticles]);

        // Remove particles after animation
        setTimeout(() => {
          setParticles(prev => prev.filter(p => !newParticles.some(np => np.id === p.id)));
        }, 1500);
      };

      const handleRate = (recipeId, stars, event) => {
        const recipe = pastOrders.flatMap(o => o.recipes).find(r => r.id === recipeId);

        const currentRating = recipeRatings[recipeId] !== undefined ? recipeRatings[recipeId] : recipe.rating;

        if (currentRating === stars) {

            [recipeId]: 0

          ...prev,

            const rect = event.currentTarget.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;

      const [isCommunityRatingExpanded, setIsCommunityRatingExpanded] = useState(true);
      const customerRatingRef = React.useRef(null);

      // Sync local quantity with cart changes
      React.useEffect(() => {
        setQuantity(cart[recipe.id] || 0);
      }, [cart, recipe.id]);

      const scrollToCustomerRating = () => {
        if (!isCommunityRatingExpanded) {
          setIsCommunityRatingExpanded(true);
        }
        setTimeout(() => {
          if (customerRatingRef.current) {
            customerRatingRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        }, 100);
      };

      const handleAdd = () => {
        setQuantity(prev => prev + 1);
        onAddToCart(recipe.id, 'add');
      };

      const handleRemove = () => {
        if (quantity > 0) {
          setQuantity(prev => prev - 1);
          onAddToCart(recipe.id, 'remove');
        }
      };

      // Helper to render star with half-fill support
      const renderStar = (index, rating, size = 20) => {
        const fill = index < Math.floor(rating);
        const isHalf = index === Math.floor(rating) && rating % 1 !== 0;

        if (isHalf) {
          return (
            <svg key={index} width={size} height={size} viewBox="0 0 24 24" fill="none">
              <defs>
                <linearGradient id={`half-${index}`}>
                  <stop offset="50%" stopColor="#232323" />
                  <stop offset="50%" stopColor="white" />
                </linearGradient>
              </defs>
              <path
                d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"
                fill={`url(#half-${index})`}
                stroke="#232323"
                strokeWidth="1.5"
                strokeLinejoin="round"
              />
            </svg>
          );
        }

        return (
          <svg key={index} width={size} height={size} viewBox="0 0 24 24" fill="none">
            <path
              d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"

                      { label: 'Ready to eat', img: 'Bento from Google Drive.png' },

                            style={{
                              position: 'absolute',
                              width: 58,
                              height: 58,
                              top: 5,

                        <span style={{
                          fontFamily: 'var(--font-body)',

                </div>

                {/* On sale this week section */}
                <div style={{ padding: '16px 0 24px', background: '#EFE9DE', margin: '40px -16px 0' }}>

                  </div>

                  <div style={{ display: 'flex', gap: 12, overflowX: 'auto', paddingLeft: 16, paddingRight: 16 }} className="h-scroll">
                    {[
                      { id: 'sale-1', name: 'Sesame Beef Noodle Stir-Fry', time: '25 min', kcal: '680 kcal', protein: '32g protein', newPrice: '$9.99', oldPrice: '$12.99', img: 'recipes/HelloFresh Main Image (15).jpg' },
                      { id: 'sale-2', name: 'Glazed Sirloin with Fresh Greens', time: '20 min', kcal: '720 kcal', protein: '38g protein', newPrice: '$10.49', oldPrice: '$13.99', img: 'recipes/HelloFresh Main Image (16).jpg' },
                      { id: 'sale-3', name: 'Crispy Chicken with Sweet Potato Wedges', time: '20 min', kcal: '520 kcal', protein: '28g protein', newPrice: '$11.49', oldPrice: '$14.99', img: 'recipes/HelloFresh Main Image (10).jpg' },
                      { id: 'sale-4', name: 'Pork Tacos with Lime Slaw', time: '25 min', kcal: '680 kcal', protein: '35g protein', newPrice: '$8.99', oldPrice: '$11.99', img: 'recipes/HelloFresh Main Image (11).jpg' },
                    ].map((meal) => (
                      <div key={meal.id} style={{

                          {/* Stepper */}
                          <div style={{ position: 'absolute', top: 0, right: 0, zIndex: 5 }}>
                            {(cart[meal.id] || 0) === 0 ? (
                              <button
                                type="button"
                                onClick={(e) => {
                                  e.stopPropagation();
                                  setCart(prev => ({ ...prev, [meal.id]: 1 }));
                                  setOnSaleEditing(prev => ({ ...prev, [meal.id]: true }));
                                  if (onSaleTimeoutRef.current[meal.id]) clearTimeout(onSaleTimeoutRef.current[meal.id]);
                                  onSaleTimeoutRef.current[meal.id] = setTimeout(() => setOnSaleEditing(prev => ({ ...prev, [meal.id]: false })), 800);
                                }}
                                style={{
                                  display: 'flex',
                                  alignItems: 'center',
                                  justifyContent: 'center',
                                  width: 36,
                                  height: 36,
                                  background: 'var(--color-stepper-bg)',
                                  border: 'none',
                                  borderRadius: '0 12px 0 8px',
                                  cursor: 'pointer',
                                }}
                              >
                                {Icons.plus(16, 'black')}
                              </button>
                            ) : onSaleEditing[meal.id] ? (
                              <div style={{
                                display: 'flex',
                                alignItems: 'center',
                                background: 'var(--color-stepper-bg)',
                                borderRadius: '0 12px 0 8px',
                                overflow: 'hidden',
                                height: 36,
                              }}>
                                <button onClick={(e) => {
                                  e.stopPropagation();
                                  setCart(prev => {
                                    const c = { ...prev };
                                    if (c[meal.id] > 1) c[meal.id] -= 1;
                                    else delete c[meal.id];
                                    return c;
                                  });
                                  if (onSaleTimeoutRef.current[meal.id]) clearTimeout(onSaleTimeoutRef.current[meal.id]);
                                  onSaleTimeoutRef.current[meal.id] = setTimeout(() => setOnSaleEditing(prev => ({ ...prev, [meal.id]: false })), 800);
                                }} style={{
                                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                                  width: 36, height: 36, background: 'transparent', border: 'none', cursor: 'pointer',
                                }}>
                                  {Icons.minus(14, 'black')}
                                </button>
                                <span style={{ width: 20, textAlign: 'center', fontFamily: 'var(--font-body)', fontSize: 12, fontWeight: 700, color: 'black' }}>{cart[meal.id]}</span>
                                <button onClick={(e) => {
                                  e.stopPropagation();
                                  setCart(prev => ({ ...prev, [meal.id]: (prev[meal.id] || 0) + 1 }));
                                  if (onSaleTimeoutRef.current[meal.id]) clearTimeout(onSaleTimeoutRef.current[meal.id]);
                                  onSaleTimeoutRef.current[meal.id] = setTimeout(() => setOnSaleEditing(prev => ({ ...prev, [meal.id]: false })), 800);
                                }} style={{
                                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                                  width: 36, height: 36, background: 'transparent', border: 'none', cursor: 'pointer',
                                }}>
                                  {Icons.plus(14, 'black')}
                                </button>
                              </div>
                            ) : (
                              <button onClick={(e) => {
                                e.stopPropagation();
                                setOnSaleEditing(prev => ({ ...prev, [meal.id]: true }));
                                if (onSaleTimeoutRef.current[meal.id]) clearTimeout(onSaleTimeoutRef.current[meal.id]);
                                onSaleTimeoutRef.current[meal.id] = setTimeout(() => setOnSaleEditing(prev => ({ ...prev, [meal.id]: false })), 800);
                              }} style={{
                                display: 'flex',
                                alignItems: 'center',
                                justifyContent: 'center',
                                width: 36,
                                height: 36,
                                background: 'var(--color-brand-primary)',
                                border: 'none',
                                borderRadius: '0 12px 0 8px',
                                cursor: 'pointer',
                              }}>
                                <span style={{
                                  fontFamily: 'var(--font-body)',
                                  fontSize: 'var(--fs-sm)',
                                  fontWeight: 700,
                                  color: 'black',
                                }}>{cart[meal.id]}</span>
                              </button>
                            )}
                          </div>
                        </div>
                        {/* Text content below image */}
                        <div style={{ padding: 12, background: 'rgba(255, 255, 255, 0.7)', flex: 1 }}>
                          <div style={{
                            fontFamily: 'var(--font-body)',
                            fontSize: 'var(--fs-sm)',
                            fontWeight: 700,
                            color: 'black',
                            marginBottom: 4,
                            lineHeight: 1.3,
                          }}>{meal.name}</div>
                          <div style={{
                            fontFamily: 'var(--font-body)',
                            fontSize: 11,
                            color: '#666666',
                            marginBottom: 4,
                          }}>{meal.time} · {meal.kcal} · {meal.protein}</div>
                          <div style={{
                            fontFamily: 'var(--font-body)',
                            fontSize: 11,
                            color: '#666666',
                          }}><span style={{ fontWeight: 700, color: '#db1d1d' }}>{meal.newPrice}</span> <span style={{ textDecoration: 'line-through' }}>{meal.oldPrice}</span> per serving</div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>

              {/* Floating bottom bar with cart */}
              <div style={{
                position: 'absolute',
                bottom: 83,
                left: 8,
                right: 8,
                background: 'var(--color-elevation-level-1)',
                borderRadius: 'var(--radius-md)',
                padding: 16,
                display: 'flex',
                flexDirection: 'column',
                gap: 16,
                zIndex: 10,
              }}>
                {/* Action row */}
                <div style={{ display: 'flex', gap: 8, alignItems: 'stretch' }}>
                  {/* Cart CTA */}
                  <button
                    onClick={onCartClick}
                    style={{
                      display: 'flex',
                      alignItems: 'center',
                      gap: 8,
                      padding: '8px 24px',
                      border: '1px solid black',
                      borderRadius: 'var(--radius-button)',
                      background: 'var(--color-elevation-level-1)',
                      cursor: 'pointer',
                      position: 'relative',
                      flexShrink: 0,
                    }}
                  >
                    {Icons.cart(24, 'black')}
                    {totalItems >= 0 && (
                      <span style={{
                        position: 'absolute',
                        top: 0,
                        left: 35,
                        display: 'inline-flex',
                        alignItems: 'center',
                        justifyContent: 'center',
                        minWidth: 20,
                        height: 20,
                        padding: '0 6px',
                        background: 'var(--color-badge-positive-bg)',
                        color: 'var(--color-badge-fg)',
                        borderRadius: 'var(--radius-tag-pill)',
                        border: '2px solid var(--color-badge-border)',
                        fontFamily: 'var(--font-body)',
                        fontSize: 'var(--fs-xs)',
                        fontWeight: 700,
                      }}>{totalItems}</span>
                    )}
                  </button>

                  {/* Continue button */}
                  <button
                    onClick={() => setShowCategoriesPage(false)}
                    style={{
                      flex: 1,
                      display: 'flex',
                      alignItems: 'center',
                      justifyContent: 'center',
                      gap: 8,
                      padding: '8px 24px',
                      minWidth: 88,
                      border: 'none',
                      borderRadius: 'var(--radius-button)',
                      background: 'black',
                      color: 'white',
                      cursor: 'pointer',
                      fontFamily: 'var(--font-body)',
                      fontSize: 'var(--fs-md)',
                      fontWeight: 700,
                      lineHeight: 'var(--lh-md)',
                    }}
                  >
                    Continue
                  </button>
                </div>
              </div>

              {/* Bottom Navigation */}
              <div style={{
                position: 'absolute',
                bottom: 0,
                left: 0,
                right: 0,
                background: 'var(--color-bottom-nav-bg)',
                zIndex: 20,
              }}>
                {/* Divider */}
                <div style={{ height: 1, background: 'var(--color-divider)' }} />

                <div style={{
                  display: 'flex',
                  justifyContent: 'space-around',
                  padding: '4px 0',
                }}>
                  {[
                    { icon: 'home', label: 'Home' },
                    { icon: 'fork_knife', label: 'Menu' },
                    { icon: 'gift', label: 'HelloFriends' },
                    { icon: 'trophy', label: 'Rewards' },
                    { icon: 'profile', label: 'Profile' },
                  ].map((item, i) => {
                    const isActive = i === 1;
                    return (
                      <div
                        key={i}
                        onClick={() => setShowCategoriesPage(false)}
                        style={{
                          display: 'flex',
                          flexDirection: 'column',
                          alignItems: 'center',

                      >
                        <div style={{
                          width: 48,

                          borderRadius: 'var(--radius-tag-pill)',

                          fontFamily: 'var(--font-body)',
                          fontSize: 'var(--fs-xs)',
                          fontWeight: 700,
                          lineHeight: 'var(--lh-xs)',

                {/* Home indicator */}
                <div style={{ display: 'flex', justifyContent: 'center', paddingBottom: 8, paddingTop: 4 }}>

    // ========== MAIN APP ==========
    function App() {
      const [currentPage, setCurrentPage] = useState('home');
      const [cart, setCart] = useState({ 2: 1, 4: 1, 1: 1, 5: 1 }); // First 4 recipes before BenefitsWidget are selected by default
      const [showCart, setShowCart] = useState(false);
      const [showRatingDrawer, setShowRatingDrawer] = useState(false);
      const [ratingDrawerSource, setRatingDrawerSource] = useState('home'); // 'home' or 'menu'
      const [recipeRatings, setRecipeRatings] = useState({});
      const [showMoreRecipes, setShowMoreRecipes] = useState(false);
      const [showPastOrders, setShowPastOrders] = useState(false);
      const [bookmarkedRecipes, setBookmarkedRecipes] = useState(new Set([1, 3, 5, 6, 7, 8, 9, 10])); // Initialize with saved recipes (8,9,10 are "not available")
      const [openCartToSavedRecipes, setOpenCartToSavedRecipes] = useState(false);

      const toggleBookmark = (recipeId) => {
        setBookmarkedRecipes(prev => {
          const newSet = new Set(prev);
          if (newSet.has(recipeId)) {
            newSet.delete(recipeId);
          } else {
            newSet.add(recipeId);
          }
          return newSet;
        });
      };

      // Initial recipes for rating drawer
      const initialRecipes = [
        { name: 'Cheddar-Crusted Chicken with Roasted Vegetables', img: 'recipes/HelloFresh Main Image.jpg' },
        { name: 'Creamy Tuscan Shrimp Pasta', img: 'recipes/HelloFresh Main High.jpg' },
        { name: 'Honey Garlic Glazed Salmon', img: 'recipes/HelloFresh Main High (1).jpg' },
        { name: 'Mediterranean Chicken Bowl', img: 'recipes/HelloFresh Main High (2).jpg' },
      ];

      // Additional recipes to show after "Show more"
      const moreRecipes = [
        { name: 'Firecracker Meatballs with Jasmine Rice', img: 'recipes/HelloFresh Main Image (1).jpg' },
        { name: 'Cheesy Black Bean & Bacon Burritos', img: 'recipes/HelloFresh Main Image (2).jpg' },
        { name: 'Crispy Parmesan Chicken Milanese', img: 'recipes/HelloFresh Main Image (3).jpg' },
      ];

      const recipesToRate = showMoreRecipes ? [...initialRecipes, ...moreRecipes] : initialRecipes;

      const totalItems = Object.values(cart).reduce((sum, q) => sum + q, 0);

      const handleNavClick = (label) => {
        if (label === 'Home') setCurrentPage('home');
        else if (label === 'Menu') setCurrentPage('menu');
        else alert(`Navigating to ${label}...`);
      };

      const handleViewSavedRecipes = () => {
        setOpenCartToSavedRecipes(true);
        setShowCart(true);
      };

      const addToCart = (id) => setCart(prev => ({ ...prev, [id]: (prev[id] || 0) + 1 }));
      const removeFromCart = (id) => setCart(prev => {
        const c = { ...prev };
        if (c[id] > 1) c[id] -= 1;
        else delete c[id];
        return c;
      });

      return (
        <div className="phone-frame">
          {showPastOrders ? (
            <PastOrdersPage onBack={() => setShowPastOrders(false)} />
          ) : currentPage === 'home' ? (
            <HomePage
              onNavigateToMenu={() => setCurrentPage('menu')}
              onShowRating={() => {
                setRatingDrawerSource('home');
                setShowRatingDrawer(true);
              }}
              onNavigateToPastOrders={() => setShowPastOrders(true)}
            />
          ) : (
            <MenuPage
              cart={cart}
              setCart={setCart}
              onCartClick={() => setShowCart(true)}
              onShowRating={() => {
                setRatingDrawerSource('menu');
                setShowRatingDrawer(true);
              }}
              bookmarkedRecipes={bookmarkedRecipes}
              toggleBookmark={toggleBookmark}
              onViewSavedRecipes={handleViewSavedRecipes}
            />
          )}

          {!showPastOrders && (
            <BottomNavigation
              onNavClick={handleNavClick}
              activePage={currentPage}
            />
          )}

          <CartDrawer
            isOpen={showCart}
            onClose={() => {
              setShowCart(false);
              setOpenCartToSavedRecipes(false);
            }}
            cart={cart}
            mealsData={mealsData}
            onRemove={removeFromCart}
            onAdd={addToCart}
            bookmarkedRecipes={bookmarkedRecipes}
            toggleBookmark={toggleBookmark}
            openToSavedRecipes={openCartToSavedRecipes}
          />

          <RatingDrawer
            show={showRatingDrawer}
            onClose={() => {
              setShowRatingDrawer(false);
              setShowMoreRecipes(false);
              setRecipeRatings({});
            }}
            recipes={recipesToRate}
            ratings={recipeRatings}
            onRate={(recipeIndex, rating) => {
              setRecipeRatings(prev => ({
                ...prev,
                [recipeIndex]: rating
              }));
            }}
            onShowMoreRecipes={() => setShowMoreRecipes(true)}
            showMoreRecipes={showMoreRecipes}
            onNavigateToPastOrders={() => {
              setShowRatingDrawer(false);
              setShowPastOrders(true);
            }}
            hideRemindLater={ratingDrawerSource === 'menu'}
          />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
