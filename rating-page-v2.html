<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rating Page V2 - Experimental</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .phone-frame {
      width: 375px;
      height: 812px;
      background: white;
      border-radius: 40px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* Cooking Step - Simple version */
    .cooking-step {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #f9f6f0;
    }

    .cooking-header {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      border-bottom: 1px solid #e0d9cb;
      background: white;
    }

    .header-title {
      font-size: 16px;
      font-weight: 700;
      color: #232323;
    }

    .cooking-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      text-align: center;
    }

    .next-button {
      padding: 16px 32px;
      background: #232323;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .next-button:hover {
      background: #404040;
    }

    /* Rating Screen - New Concept */
    .rating-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: white;
      display: none;
      flex-direction: column;
      z-index: 100;
    }

    .rating-screen.active {
      display: flex;
    }

    /* Header */
    .rating-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: white;
      position: relative;
      z-index: 10;
    }

    .close-btn {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 24px;
      color: #232323;
    }

    .rating-title {
      flex: 1;
      font-size: 16px;
      font-weight: 700;
      color: #232323;
      text-align: center;
      padding: 0 8px;
    }

    .camera-btn {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      cursor: pointer;
    }

    /* Photo Container */
    .photo-container {
      position: relative;
      width: 100%;
      height: 350px;
      overflow: hidden;
    }

    .photo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Star Circle Overlay */
    .star-circle-overlay {
      position: absolute;
      bottom: -100px;
      left: 50%;
      transform: translateX(-50%);
      width: 300px;
      height: 300px;
      background: white;
      border-radius: 50%;
      box-shadow: 0 -4px 24px rgba(0,0,0,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Stars positioned in circle */
    .stars-circle {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .star-position {
      position: absolute;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      left: 50%;
      top: 50%;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .star-position.visible {
      opacity: 1;
    }

    .star-position.wiggle {
      animation: wiggle 0.6s ease-in-out;
    }

    @keyframes wiggle {
      0%, 100% { transform: translate(-50%, -50%) rotate(0deg) translateY(-100px); }
      25% { transform: translate(-50%, -50%) rotate(-10deg) translateY(-100px) scale(1.1); }
      50% { transform: translate(-50%, -50%) rotate(10deg) translateY(-100px) scale(1.1); }
      75% { transform: translate(-50%, -50%) rotate(-5deg) translateY(-100px) scale(1.05); }
    }

    /* Star positions - arranged in a circle using rotation */
    .star-position:nth-child(1) {
      transform: translate(-50%, -50%) rotate(-90deg) translateY(-100px) rotate(90deg) scale(0.5);
    }
    .star-position:nth-child(2) {
      transform: translate(-50%, -50%) rotate(-18deg) translateY(-100px) rotate(18deg) scale(0.5);
    }
    .star-position:nth-child(3) {
      transform: translate(-50%, -50%) rotate(54deg) translateY(-100px) rotate(-54deg) scale(0.5);
    }
    .star-position:nth-child(4) {
      transform: translate(-50%, -50%) rotate(126deg) translateY(-100px) rotate(-126deg) scale(0.5);
    }
    .star-position:nth-child(5) {
      transform: translate(-50%, -50%) rotate(198deg) translateY(-100px) rotate(-198deg) scale(0.5);
    }

    .star-position.visible:nth-child(1) {
      transform: translate(-50%, -50%) rotate(-90deg) translateY(-100px) rotate(90deg) scale(1);
    }
    .star-position.visible:nth-child(2) {
      transform: translate(-50%, -50%) rotate(-18deg) translateY(-100px) rotate(18deg) scale(1);
    }
    .star-position.visible:nth-child(3) {
      transform: translate(-50%, -50%) rotate(54deg) translateY(-100px) rotate(-54deg) scale(1);
    }
    .star-position.visible:nth-child(4) {
      transform: translate(-50%, -50%) rotate(126deg) translateY(-100px) rotate(-126deg) scale(1);
    }
    .star-position.visible:nth-child(5) {
      transform: translate(-50%, -50%) rotate(198deg) translateY(-100px) rotate(-198deg) scale(1);
    }

    .star-icon {
      width: 48px;
      height: 48px;
    }

    /* Center GIF */
    .center-emoji {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      width: 100px;
      height: 100px;
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .center-emoji.visible {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .center-emoji img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Content Area */
    .rating-content {
      flex: 1;
      padding: 140px 24px 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Slider */
    .slider-container {
      width: 100%;
      padding: 0 8px;
    }

    .slider {
      -webkit-appearance: none;
      width: 100%;
      height: 8px;
      border-radius: 4px;
      background: linear-gradient(to right, #4CAF50 0%, #4CAF50 0%, #E0E0E0 0%, #E0E0E0 100%);
      outline: none;
      opacity: 1;
    }

    .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: white;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      transition: transform 0.2s;
    }

    .slider::-webkit-slider-thumb:hover {
      transform: scale(1.1);
    }

    .slider::-moz-range-thumb {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: white;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      border: none;
    }

    /* Comment Bubbles */
    .comment-bubbles {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.4s ease-out;
    }

    .comment-bubbles.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .bubble {
      padding: 10px 20px;
      background: #E8F5E9;
      border: none;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 500;
      color: #2E7D32;
      cursor: pointer;
      transition: all 0.2s;
      animation: bubbleIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
    }

    .bubble:nth-child(1) { animation-delay: 0.1s; }
    .bubble:nth-child(2) { animation-delay: 0.2s; }
    .bubble:nth-child(3) { animation-delay: 0.3s; }
    .bubble:nth-child(4) { animation-delay: 0.4s; }
    .bubble:nth-child(5) { animation-delay: 0.5s; }

    @keyframes bubbleIn {
      from {
        opacity: 0;
        transform: scale(0.8) translateY(10px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .bubble:hover {
      background: #C8E6C9;
      transform: scale(1.05);
    }

    .bubble.selected {
      background: #4CAF50;
      color: white;
    }

    /* Add Comment */
    .add-comment {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      background: #F5F5F5;
      border-radius: 12px;
      cursor: pointer;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.4s ease-out 0.6s;
    }

    .add-comment.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .comment-icon {
      width: 24px;
      height: 24px;
      color: #666;
    }

    .comment-text {
      font-size: 16px;
      color: #666;
    }

    /* Submit Button */
    .submit-btn {
      width: 100%;
      padding: 16px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.4s ease-out 0.7s;
    }

    .submit-btn.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .submit-btn:hover {
      background: #45A049;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3);
    }

    .submit-btn:disabled {
      background: #E0E0E0;
      cursor: not-allowed;
      transform: translateY(0);
      box-shadow: none;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="phone-frame">
    <!-- Simple Cooking Step -->
    <div class="cooking-step" id="cookingStep">
      <div class="cooking-header">
        <span class="header-title">Step 6 of 6 - Plate and Serve</span>
      </div>
      <div class="cooking-content">
        <h2 style="margin-bottom: 24px;">You're done cooking!</h2>
        <button class="next-button" onclick="showRatingScreen()">Rate this meal →</button>
      </div>
    </div>

    <!-- New Rating Screen -->
    <div class="rating-screen" id="ratingScreen">
      <!-- Header -->
      <div class="rating-header">
        <button class="close-btn" onclick="closeRating()">✕</button>
        <div class="rating-title">Did you like BBQ Chicken Wings?</div>
        <button class="camera-btn">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <rect x="3" y="5" width="18" height="14" rx="2" stroke="#232323" stroke-width="2"/>
            <circle cx="12" cy="12" r="3" stroke="#232323" stroke-width="2"/>
            <path d="M9 5L10 3h4l1 2" stroke="#232323" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <!-- Photo with Star Overlay -->
      <div class="photo-container">
        <img src="recipes/HelloFresh Main Image.jpg" alt="BBQ Chicken Wings">

        <!-- Star Circle Overlay -->
        <div class="star-circle-overlay">
          <div class="stars-circle" id="starsCircle">
            <!-- Stars will be positioned in a circle -->
          </div>

          <!-- Center GIF -->
          <div class="center-emoji" id="centerEmoji">
            <img src="Emoji With Chef Hat.gif" alt="Chef emoji">
          </div>
        </div>
      </div>

      <!-- Content -->
      <div class="rating-content">
        <!-- Slider -->
        <div class="slider-container">
          <input type="range" min="0" max="5" value="0" class="slider" id="ratingSlider">
        </div>

        <!-- Comment Bubbles -->
        <div class="comment-bubbles" id="commentBubbles">
          <button class="bubble">Tasty</button>
          <button class="bubble">Food quality</button>
          <button class="bubble">Easy to cook</button>
          <button class="bubble">Serving size</button>
          <button class="bubble">Packaging</button>
        </div>

        <!-- Add Comment -->
        <div class="add-comment" id="addComment">
          <svg class="comment-icon" viewBox="0 0 24 24" fill="none">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="comment-text">Add comment</span>
        </div>

        <!-- Submit Button -->
        <button class="submit-btn" id="submitBtn" disabled>Submit</button>
      </div>
    </div>
  </div>

  <script>
    const state = {
      rating: 0,
      selectedBubbles: new Set()
    };

    // Create stars
    function createStars() {
      const container = document.getElementById('starsCircle');
      for (let i = 0; i < 5; i++) {
        const starDiv = document.createElement('div');
        starDiv.className = 'star-position';
        starDiv.innerHTML = `
          <svg class="star-icon" viewBox="0 0 24 24" fill="#FFD700">
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" stroke="#FFD700" stroke-width="1.5" stroke-linejoin="round"/>
          </svg>
        `;
        container.appendChild(starDiv);
      }
    }

    // Show rating screen
    function showRatingScreen() {
      document.getElementById('cookingStep').classList.add('hidden');
      document.getElementById('ratingScreen').classList.add('active');
    }

    // Close rating screen
    function closeRating() {
      document.getElementById('ratingScreen').classList.remove('active');
      document.getElementById('cookingStep').classList.remove('hidden');
      resetRating();
    }

    // Update slider background
    function updateSliderBackground(value) {
      const slider = document.getElementById('ratingSlider');
      const percentage = (value / 5) * 100;
      slider.style.background = `linear-gradient(to right, #4CAF50 0%, #4CAF50 ${percentage}%, #E0E0E0 ${percentage}%, #E0E0E0 100%)`;
    }

    // Handle slider change
    document.getElementById('ratingSlider').addEventListener('input', function(e) {
      const value = parseInt(e.target.value);
      state.rating = value;

      updateSliderBackground(value);
      updateStars(value);
      updateSubmitButton();

      if (value > 0) {
        showCommentBubbles();
      }
    });

    // Update stars visibility and animation
    function updateStars(rating) {
      const stars = document.querySelectorAll('.star-position');
      const centerEmoji = document.getElementById('centerEmoji');

      stars.forEach((star, index) => {
        if (index < rating) {
          star.classList.add('visible');

          // Add wiggle animation for good ratings (4-5 stars)
          if (rating >= 4) {
            star.classList.remove('wiggle');
            void star.offsetWidth; // Trigger reflow
            star.classList.add('wiggle');
          }
        } else {
          star.classList.remove('visible', 'wiggle');
        }
      });

      // Show GIF for good ratings
      if (rating >= 4) {
        centerEmoji.classList.add('visible');
      } else {
        centerEmoji.classList.remove('visible');
      }
    }

    // Show comment bubbles
    function showCommentBubbles() {
      document.getElementById('commentBubbles').classList.add('visible');
      document.getElementById('addComment').classList.add('visible');
      document.getElementById('submitBtn').classList.add('visible');
    }

    // Handle bubble clicks
    document.querySelectorAll('.bubble').forEach(bubble => {
      bubble.addEventListener('click', function() {
        this.classList.toggle('selected');
      });
    });

    // Update submit button
    function updateSubmitButton() {
      const btn = document.getElementById('submitBtn');
      btn.disabled = state.rating === 0;
    }

    // Reset rating
    function resetRating() {
      state.rating = 0;
      state.selectedBubbles.clear();

      const slider = document.getElementById('ratingSlider');
      slider.value = 0;
      updateSliderBackground(0);

      document.querySelectorAll('.star-position').forEach(star => {
        star.classList.remove('visible', 'wiggle');
      });

      document.getElementById('centerEmoji').classList.remove('visible');
      document.getElementById('commentBubbles').classList.remove('visible');
      document.getElementById('addComment').classList.remove('visible');
      document.getElementById('submitBtn').classList.remove('visible');

      document.querySelectorAll('.bubble').forEach(bubble => {
        bubble.classList.remove('selected');
      });

      updateSubmitButton();
    }

    // Initialize
    createStars();
    updateSliderBackground(0);
  </script>
</body>
</html>
